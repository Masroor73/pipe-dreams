<svg xmlns="http://www.w3.org/2000/svg" width="680" height="574" viewBox="0 0 680 574" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Pipe Dreams architecture</title>
<desc>Calgary public data flows into a Python engine that matches breaks, ranks V1, tests four tweaks and decides V2. Results are saved, served by FastAPI, and shown in a React dashboard.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="574" fill="#FFFFFF"/>
<g><rect x="190" y="40" width="300" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Calgary public data</text><text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Pipes, 37,538 breaks, 313 communities</text></g>
<line x1="340" y1="96" x2="340" y2="124" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="126" width="600" height="150" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Python engine: pandas, GeoPandas, scikit-learn (offline)</text></g>
<g><rect x="52" y="176" width="132" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="118" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Match breaks</text><text x="118" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">to real pipes</text></g>
<g><rect x="200" y="176" width="132" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="266" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Rank V1</text><text x="266" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">first plan</text></g>
<g><rect x="348" y="176" width="132" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="414" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Test 4 tweaks</text><text x="414" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">on past years</text></g>
<g><rect x="496" y="176" width="132" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="562" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Decide V2</text><text x="562" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">or keep V1</text></g>
<line x1="184" y1="214" x2="198" y2="214" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="332" y1="214" x2="346" y2="214" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="214" x2="494" y2="214" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="276" x2="340" y2="304" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="190" y="306" width="300" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Saved results</text><text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Frozen artifacts + audit log</text></g>
<line x1="340" y1="362" x2="340" y2="390" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="190" y="392" width="300" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="340" y="414" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">FastAPI</text><text x="340" y="432" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Serves saved results only</text></g>
<line x1="340" y1="448" x2="340" y2="476" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="190" y="478" width="300" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="340" y="500" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">React dashboard</text><text x="340" y="518" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Communities, map, agent replay</text></g>
</svg>
